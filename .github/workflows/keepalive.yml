# GitHub Actions automatically disables scheduled workflows after 60 days
# without repository activity. This workflow commits a small heartbeat file
# twice a month so the `schedule` trigger on stock-monitor.yml never lapses,
# even if the target product stays out of stock for a long time.
name: Repository keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1,15 * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update heartbeat timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-timestamp.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-timestamp.txt
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: keepalive heartbeat [skip ci]"
            git push
          fi
