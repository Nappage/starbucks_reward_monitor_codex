name: Starbucks stock monitor

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send Telegram test notification with current statuses"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7,37 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run stock monitor (rendered mode)
        run: |
          EXTRA_ARGS=""
          if [ "$SEND_TEST_NOTIFICATION" = "true" ]; then
            EXTRA_ARGS="--send-test-notification"
          fi

          PYTHONPATH=src python -m starbucks_monitor.cli \
            --mode rendered \
            --product "スターマグ ブラウン 296ml" \
            --product "スターマグ グリーン 296ml" \
            --telegram-bot-token "$TELEGRAM_BOT_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID" \
            $EXTRA_ARGS
