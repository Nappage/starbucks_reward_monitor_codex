# Automated stock monitor for Starbucks reward products
name: Starbucks stock monitor

on:
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send Bluesky test post with current statuses"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      SEND_TEST_NOTIFICATION: ${{ github.event.inputs.send_test_notification || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run stock monitor (rendered mode)
        run: |
          EXTRA_ARGS=""
          if [ "$SEND_TEST_NOTIFICATION" = "true" ]; then
            EXTRA_ARGS="--send-test-notification"
          fi

          PYTHONPATH=src python -m starbucks_monitor.cli \
            --mode rendered \
            --product "スターマグ ブラウン 296ml" \
            --product "スターマグ グリーン 296ml" \
            --bluesky-identifier "$BLUESKY_IDENTIFIER" \
            --bluesky-app-password "$BLUESKY_APP_PASSWORD" \
            $EXTRA_ARGS

      - name: Persist monitor state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- .starbucks_monitor_state.json .starbucks_monitor_notifications.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .starbucks_monitor_state.json .starbucks_monitor_notifications.json
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "No state changes to persist"
          fi
